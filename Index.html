
<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6556d9">
<title>WAI'S ENGLISH LEARNING ACADEMY</title>

<style>
:root{
  --primary:#6658d9;
  --secondary:#9278ed;
  --bg:#f6f7fc;
  --card:#ffffff;
  --text:#25243a;
  --muted:#77778d;
  --border:#e9e8f2;
  --soft:#f0edff;
  --shadow:0 8px 30px rgba(55,45,120,.07);
}
body.dark{
  --bg:#151522;
  --card:#202033;
  --text:#f4f3ff;
  --muted:#b3b0c9;
  --border:#35334b;
  --soft:#302b50;
  --shadow:0 8px 30px rgba(0,0,0,.2);
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,"Noto Sans Myanmar",sans-serif;
  line-height:1.7;
  transition:.25s;
}
button,input,select{font:inherit}
button{cursor:pointer}
a{text-decoration:none;color:inherit}
.topbar{
  height:70px;background:var(--card);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 5%;position:sticky;top:0;z-index:20;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;color:var(--primary)}
.brand-logo{
  width:42px;height:42px;border-radius:14px;
  background:linear-gradient(135deg,var(--primary),#ad78f0);
  display:grid;place-items:center;color:white;font-size:20px;
}
.top-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  border:1px solid var(--border);background:var(--card);
  color:var(--text);border-radius:12px;padding:9px 13px;
}
.layout{display:grid;grid-template-columns:255px 1fr;min-height:calc(100vh - 70px)}
.sidebar{
  background:var(--card);border-right:1px solid var(--border);
  padding:22px 15px;position:sticky;top:70px;height:calc(100vh - 70px);
  overflow-y:auto;
}
.side-label{
  color:var(--muted);font-size:11px;font-weight:bold;
  letter-spacing:1px;padding:15px 12px 7px;
}
.nav-btn{
  width:100%;display:flex;align-items:center;gap:12px;
  border:0;background:transparent;color:var(--muted);
  text-align:left;padding:11px 13px;border-radius:12px;
  margin:2px 0;font-size:14px;
}
.nav-btn:hover,.nav-btn.active{
  background:var(--soft);color:var(--primary);font-weight:bold;
}
.main{padding:30px 4%;max-width:1500px;width:100%;margin:auto}
.hero{
  border-radius:25px;padding:35px;
  background:linear-gradient(120deg,#5548c9,#9673e9);
  color:white;display:grid;grid-template-columns:1.4fr 1fr;
  gap:20px;align-items:center;overflow:hidden;
}
.hero h1{font-size:clamp(27px,4vw,43px);line-height:1.25;margin:8px 0}
.hero p{opacity:.9;max-width:580px}
.hero img{width:100%;max-height:230px;object-fit:cover;border-radius:20px}
.hero-tag{font-size:12px;letter-spacing:2px;font-weight:bold}
.primary-btn{
  border:0;border-radius:12px;background:white;color:#5949c8;
  font-weight:bold;padding:12px 19px;margin-top:10px;
}
.section-title{font-size:23px;margin:32px 0 5px}
.section-sub{color:var(--muted);margin:0 0 18px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}
.card{
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;overflow:hidden;box-shadow:var(--shadow);
}
.card-img{width:100%;height:155px;object-fit:cover;display:block}
.card-content{padding:17px}
.card h3{margin:0 0 5px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:13px}
.card-action{
  margin-top:14px;border:0;border-radius:10px;
  padding:9px 13px;background:var(--soft);
  color:var(--primary);font-weight:bold;
}
.pill{
  display:inline-block;padding:4px 10px;border-radius:30px;
  background:var(--soft);color:var(--primary);
  font-size:11px;font-weight:bold;margin-bottom:8px;
}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.stat{
  background:var(--card);border:1px solid var(--border);
  padding:17px;border-radius:16px;
}
.stat strong{font-size:25px;color:var(--primary);display:block}
.stat span{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.search{
  flex:1;min-width:180px;border:1px solid var(--border);
  background:var(--card);color:var(--text);
  border-radius:12px;padding:12px 15px;outline:none;
}
.select{
  border:1px solid var(--border);background:var(--card);
  color:var(--text);border-radius:12px;padding:10px;
}
.content-panel{
  background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:24px;margin-top:18px;
}
.content-panel h2{color:var(--primary)}
.lesson-text{font-size:16px;line-height:2}
.translation{
  background:var(--soft);padding:15px;border-radius:12px;
  margin:12px 0;color:var(--text);
}
.vocab-table{width:100%;border-collapse:collapse;margin-top:12px}
.vocab-table th,.vocab-table td{
  padding:11px;text-align:left;border-bottom:1px solid var(--border);
}
.vocab-table th{color:var(--primary);background:var(--soft)}
.image-wide{width:100%;max-height:350px;object-fit:cover;border-radius:16px}
.level-tabs{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}
.level-tab{
  border:1px solid var(--border);border-radius:30px;
  background:var(--card);color:var(--text);padding:9px 17px;
}
.level-tab.active{background:var(--primary);color:white;border-color:var(--primary)}
.progress-bg{height:9px;background:var(--border);border-radius:20px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),#ac78ed);width:0}
.quiz-option{
  display:block;width:100%;text-align:left;margin:9px 0;
  padding:12px;border:1px solid var(--border);
  border-radius:11px;background:var(--card);color:var(--text);
}
.quiz-option:hover{border-color:var(--primary)}
.correct{background:#dcfce7!important;color:#166534!important}
.wrong{background:#fee2e2!important;color:#991b1b!important}
.footer{text-align:center;padding:35px 10px;color:var(--muted);font-size:12px}
.hidden{display:none!important}
.back-btn{background:var(--soft);border:0;color:var(--primary);padding:9px 14px;border-radius:10px}
@media(max-width:950px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .layout{grid-template-columns:210px 1fr}
}
@media(max-width:650px){
  .layout{display:block}
  .sidebar{
    position:static;height:auto;border-right:0;border-bottom:1px solid var(--border);
    display:flex;overflow-x:auto;padding:8px;gap:5px;
  }
  .side-label{display:none}
  .nav-btn{white-space:nowrap;width:auto;flex-shrink:0;padding:9px}
  .main{padding:18px 13px}
  .hero{grid-template-columns:1fr;padding:24px}
  .hero img{max-height:170px}
  .grid{grid-template-columns:1fr}
  .stats{gap:7px}
  .stat{padding:11px}
  .stat strong{font-size:20px}
  .content-panel{padding:16px}
  .topbar{padding:0 13px}
  .brand{font-size:12px}
}
</style>
</head>

  <div class="side-label">EXAM & PROGRESS — စာမေးပွဲနှင့် တိုးတက်မှု</div>
  <button class="nav-btn" data-page="quiz" onclick="showPage('quiz')">📝 Quiz — စာမေးပွဲ</button>
  <button class="nav-btn" data-page="progress" onclick="showPage('progress')">📊 Progress — တိုးတက်မှု</button>
  <button class="nav-btn" data-page="certificates" onclick="showPage('certificates')">🏆 Certificates — အောင်လက်မှတ်</button>
</aside>

<main class="main" id="app"></main>
</div>

 {

  image:"https://images.unsplash.com/photo-1533929736458-ca588d08c8be?w=1000",
  text:"Nelson Mandela was a famous leader from South Africa. He believed that all people deserved freedom and equal rights. He spent many years fighting against racial discrimination. Although he faced many difficulties, he never gave up. His courage and determination inspired people around the world.",
  translation:"နယ်လ်ဆင် မင်ဒဲလားသည် တောင်အာဖရိကနိုင်ငံမှ ထင်ရှားသော ခေါင်းဆောင်တစ်ဦးဖြစ်သည်။ လူတိုင်းသည် လွတ်လပ်ခွင့်နှင့် တန်းတူညီမျှသော အခွင့်အရေးများ ရရှိသင့်သည်ဟု သူယုံကြည်ခဲ့သည်။ သူသည် လူမျိုးရေးခွဲခြားဆက်ဆံမှုကို ဆန့်ကျင်တိုက်ဖျက်ရန် နှစ်ပေါင်းများစွာ ကြိုးပမ်းခဲ့သည်။ အခက်အခဲများစွာ ကြုံတွေ့ခဲ့ရသော်လည်း သူသည် ဘယ်တော့မှ လက်မလျှော့ခဲ့ပါ။ သူ၏သတ္တိနှင့် ဇွဲလုံ့လသည် ကမ္ဘာတစ်ဝန်းရှိ လူများကို စိတ်ဓာတ်ခွန်အားပေးခဲ့သည်။",
  vocab:[

 },
